name: Build and release Windows app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          [xml]$project = Get-Content src/EchoReplay/EchoReplay.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid project version.' }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF -ne "v$version") { throw 'Tag and project version do not match.' }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Release notes missing.' }
      - name: Test and build installer and portable ZIP
        run: |
          try { ./build-release.ps1 }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Release build failed::$message"
            throw
          }
      - name: Test installation and uninstallation
        run: |
          try { ./scripts/Test-Installer.ps1 -InstallerPath ./artifacts/release/EchoReplay-Setup-x64.exe }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer test failed::$message"
            throw
          }
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EchoReplay-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep installer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-diagnostics
          path: |
            ${{ runner.temp }}/EchoReplay-installer-*/*.log
            ${{ runner.temp }}/EchoReplay-installer-*/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish release after all checks pass
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already public. Create a new version instead of replacing it.' }
          } else {
            gh release create $tag --verify-tag --draft --title "EchoReplay $tag" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          gh release upload $tag artifacts/release/EchoReplay-Setup-x64.exe artifacts/release/EchoReplay-portable-win-x64.zip artifacts/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
